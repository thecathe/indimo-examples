# Machine-readable link back to the survey corpus this example was distilled
# from. Ids and names are recorded so a later read-only checker can confirm they
# still resolve -- a family rename or reparent then shows up as a mismatch
# rather than silently invalidating the prose.
#
# Nothing here is written back to the database. As of the snapshot below,
# example_families is empty: no confirmed example has been assigned to a family
# yet, and this example set was built BEFORE classification deliberately, so the
# distilled form could sharpen the family boundary rather than inherit it.

family:
  id: 8
  name: Awaited Message Never Arrives
  parent: Blocking
  path: Progress Failure > Blocking > Awaited Message Never Arrives
  invariant_class: >
    every wait on a peer either observes that peer's death or bounds itself
  parameters:
    - message shape diversity
    - structure of mailbox
    - failure observation     # link, monitor, or neither

source:
